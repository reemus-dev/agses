[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tools]
bun = "1.4.3"
# oxfmt, oxlint and tsc start through Node shebangs
node = "26.8.1"

# ── Setup ───────────────────────────────────────────────────────────────────

[tasks.install]
description = "Install the locked dependencies into node_modules"
run = "bun install --frozen-lockfile"

# ── Checks ──────────────────────────────────────────────────────────────────

[tasks.check]
description = "Typecheck, lint, check formatting and test without modifying files"
depends = ["typecheck", "lint", "format:check", "test"]

[tasks.typecheck]
description = "Typecheck the CLI"
run = "tsc -p tsconfig.json"

[tasks.test]
description = "Run the CLI against the fixture sessions"
run = "bun test"

[tasks.lint]
description = "Lint the CLI without modifying files"
run = "oxlint"

[tasks."format:check"]
description = "Check formatting of repository files without modifying them"
run = "oxfmt --check"

# ── Fixes ───────────────────────────────────────────────────────────────────

[tasks.fix]
description = "Apply oxlint's safe fixes, then format repository files"
run = ["oxlint --fix", { task = "format" }]

[tasks.format]
description = "Format repository files"
run = "oxfmt"

# ── Release ─────────────────────────────────────────────────────────────────

# The pushed tag starts release.yml, which publishes to npm and makes the tag's
# message the GitHub release notes
[tasks.release]
description = "Bump the version, commit it, tag it with the release notes, then push to release"
usage = '''
arg "<bump>" help="patch, minor, major or an exact version"
arg "<notes>" help="Markdown file with the release notes"
'''
run = '''
set -eu
test -s "$usage_notes" || { echo "No release notes in $usage_notes" >&2; exit 1; }
tag=$(npm version "$usage_bump" -m "Release %s")
# npm tags with the commit message. --cleanup=whitespace keeps Markdown
# headings, which git otherwise strips as comments.
git tag -f -a "$tag" --cleanup=whitespace -F "$usage_notes"
git push --follow-tags
'''
